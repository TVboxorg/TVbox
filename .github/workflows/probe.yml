name: Probe interfaces

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "sources.yaml"
      - "scripts/**"
      - ".github/workflows/probe.yml"

concurrency:
  group: probe-interfaces
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe sources
        run: python3 scripts/probe.py

      - name: Build dist
        run: python3 scripts/build.py

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No dist changes"
            exit 0
          fi
          git commit -m "chore: update probe results"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebase and retry ($i/5)..."
            git pull --rebase origin HEAD
            sleep $((i * 2))
          done
          echo "Failed to push after retries"
          exit 1
